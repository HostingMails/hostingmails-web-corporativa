name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: |
          npm run typecheck --if-present
          npm run type-check --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: No hay secretos en el bundle
        run: |
          if grep -rEq 're_[A-Za-z0-9_]{16,}|sk_live_[A-Za-z0-9]{16,}|service_role' dist/ 2>/dev/null; then
            echo "::error::Hay algo con pinta de secreto en dist/"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 5

  # Deploy en Coolify: solo en main y si el CI pasa. Sin el secret del webhook, avisa y no hace nada.
  deploy:
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          URL: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          [ -n "$URL" ] || { echo "::warning::Falta el secret COOLIFY_WEBHOOK: no se despliega."; exit 0; }
          [ -n "$TOKEN" ] || { echo "::error::Falta el secret COOLIFY_TOKEN."; exit 1; }
          curl -fsS "$URL" -H "Authorization: Bearer $TOKEN"
